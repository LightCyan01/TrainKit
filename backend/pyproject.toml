[project]
name = "backend"
version = "0.1.0"
description = "Authenticated local processing backend for TrainKit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.11.0",
    "difpy>=4.2.1",
    "fastapi>=0.139.0,<0.140",
    "ncnn>=1.0.20260526",
    "numpy>=2.3.0",
    "pillow>=12.3.0,<13",
    "spandrel>=0.4.2,<0.5",
    "tiler>=0.6.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=5.13.1,<6",
    "uvicorn[standard]>=0.51.0,<0.52",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
